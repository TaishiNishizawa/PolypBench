name: realcolon
root: REAL-Colon               # relative to data_root; a symlink to the NAS copy (Paper_Progress.md section 3)
frames_dir: frames             # <root>/frames/<video>_frames/<video>_<frame>.jpg
video_info: video_info.csv     # organizers' per-video metadata: fps, num_frames, endoscope_brand
annotations_dir: annotations   # <root>/annotations/<video>_annotations.tar.gz: one Pascal-VOC XML per frame

# Models read the ORIGINAL frames, so each model's own training resize starts
# from the same pixels it did on SUN-SEG. A smaller copy (640 px long side,
# scripts/build_realcolon_cache.py) exists at
# <data_root>/<cache.root>/L<long_side>/<video>/<frame:06d>.jpg, but is not
# used for inference: its extra area-averaging resize changed EMCAD's masks
# (Dice 0.88 vs the training-matching resize on 004-012; SALI 0.97), see
# Paper_Progress.md section 7. Kept for visualization.
frames_from: original          # original | cache
cache:
  root: REAL-Colon-cache       # relative to data_root; a symlink to /mnt/dm-3/taishi/realcolon-cache
  long_side: 640               # >= every model input; TRUE-Colon's 640x640 letterbox then needs no resampling
  jpeg_quality: 95             # with 4:4:4 chroma (no colour subsampling)

# 60 full procedures, 4 cohorts x 15 videos (001 US, 002 Italy, 003 Austria,
# 004 Japan). Frame ids are 0-based and contiguous (0 .. num_frames-1), so a
# frame's id is its index. Frame rate varies per video (25, 29.97 or 60 fps):
# always take it from video_info.csv. Ground truth is boxes, not masks
# (per-frame Pascal-VOC XML in <root>/annotations/), so sequences carry no
# mask annotations.

# Videos whose frame (and annotation) files are named <video>_<frame>.0.jpg
# instead of <video>_<frame>.jpg. Checked on the 31 videos downloaded by
# 2026-10-21; recheck once the train split is complete.
float_frame_names: [001-012]

# Official split (REAL-Colon paper; same in TRUE-Colon): per cohort, videos
# 1-10 train, 11-12 val, 13-15 test.
splits:
  train: [001-001, 001-002, 001-003, 001-004, 001-005, 001-006, 001-007, 001-008, 001-009, 001-010,
          002-001, 002-002, 002-003, 002-004, 002-005, 002-006, 002-007, 002-008, 002-009, 002-010,
          003-001, 003-002, 003-003, 003-004, 003-005, 003-006, 003-007, 003-008, 003-009, 003-010,
          004-001, 004-002, 004-003, 004-004, 004-005, 004-006, 004-007, 004-008, 004-009, 004-010]
  val: [001-011, 001-012, 002-011, 002-012, 003-011, 003-012, 004-011, 004-012]
  test: [001-013, 001-014, 001-015, 002-013, 002-014, 002-015, 003-013, 003-014, 003-015,
         004-013, 004-014, 004-015]

# In-patient frame ranges [first, last], inclusive, published by TRUE-Colon
# (Doerrich et al., arXiv 2608.13711, Table B.1; their "1_13" is video
# 001-013). Frames outside are outside the patient (insertion / withdrawal).
# Models run on every frame; this trimming is applied only at evaluation.
# Check: the test ranges sum to 572,085 frames, TRUE-Colon's test-set size.
