model_id: mkunet@sunseg
arch: mkunet
backend: onnx
weights: checkpoints/mkunet@sunseg/model.onnx     # relative to artifacts_root; written by scripts/export_onnx.py
source: >-
  Trained by us on SUN-SEG TrainDataset (minus held-out validation videos)
  with scripts/train.py and configs/train/sunseg.yaml; MK-UNet code from
  third_party/MK-UNet (SLDGroup/MK-UNet).
input_size: 352
input_channels: 3
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
output_index: 0

train:
  code: third_party/MK-UNet
  module: mkunet_network
  class: MK_UNet
  kwargs:                          # MK-UNet train_polyp.py default network (MK_UNet)
    num_classes: 1
    in_channels: 3
    channels: [16, 32, 64, 96, 160]
  pretrained_backbone: null        # trained from scratch, as in the original
  supervision: final_only          # forward returns [p4]; loss on that single output
  final_output: -1
