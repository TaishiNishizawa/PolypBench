model_id: sacnet-b2@sunseg
arch: sacnet-b2
backend: onnx
weights: checkpoints/sacnet-b2@sunseg/model.onnx  # relative to artifacts_root; written by scripts/export_onnx.py
source: >-
  Trained by us on SUN-SEG TrainDataset (minus held-out validation videos)
  with scripts/train.py and configs/train/sunseg.yaml; SACNet code from
  third_party/SACNet (lab repository).
input_size: 352
input_channels: 3
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
output_index: 0                    # the export has a single output: the final head

train:
  code: third_party/SACNet
  module: lib_SACNET.networks
  class: SACNetNet
  kwargs:                          # SACNet train_polyp.py defaults
    num_classes: 1
    encoder: pvt_v2_b2
    kernel_sizes: [1, 3, 5]
    expansion_factor: 2
    dw_parallel: true
    add: true
    gag_ks: 3
    activation: relu6
    samd_ratio: 16
  pretrained_backbone: checkpoints/pretrained/pvt_v2_b2.pth
  supervision: heads_and_sum
  final_output: -1                 # forward returns [o4, o3, o2, o1]; o1 (finest) is the prediction
