# The prime recipe (configs/train/prime.yaml) under the field's SUN-SEG
# protocol: train on all 112 TrainDataset clips and choose the best epoch on
# TestHardDataset/Seen, as SALI and CMSA-Net do. Everything else is identical
# to prime.yaml. Seen results are biased by the selection; Unseen are not.
name: prime_ft
dataset: sunseg               # configs/datasets/sunseg.yaml
val_split: TestHardDataset/Seen   # train on all of TrainDataset, select the epoch on this test split

epochs: 30
batch_size: 16
img_size: 352
multiscale: [0.75, 1.0, 1.25]

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
scheduler:                    # eta_min = lr: the cosine schedule stays constant (CASCADE's step decay never fires)
  name: cosine
  eta_min: 1.0e-4
grad_clip: 0.5                # CASCADE --clip 0.5

augmentation:                 # none (PRIME §4.2); all probabilities 0
  rotate_limit: 90
  rotate_p: 0.0
  vflip_p: 0.0
  hflip_p: 0.0
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

val_threshold: 0.5
num_workers: 8
seed: 0
