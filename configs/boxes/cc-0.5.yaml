# Probability map -> boxes (postproc/boxes.py): one box per connected component of the
# map thresholded at `threshold`, at the model's output resolution, scaled to the frame.
# Each box keeps both candidate scores (peak and mean probability over the component) and
# its area, so the score rule and the minimum area are chosen at evaluation, not here.
name: cc-0.5
threshold: 0.5        # binarization: prob >= threshold (uint8 >= 128)
connectivity: 8
min_area_px: 4        # at map resolution (352 x 352 = 0.003%): only drops specks to keep tables small
