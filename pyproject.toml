[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "polypbench"
version = "0.1.0"
description = "Benchmarking image and video polyp segmentation models"
requires-python = ">=3.10"
dependencies = []   # managed in environment.yml (conda-forge)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]   # don't collect third_party/ (e.g. SALI's test_video.py is a script, not a test)
